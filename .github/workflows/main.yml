
name: Devops_CI_CD-Dev/UAT/Staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run against'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'uat'
          - 'staging'
          

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  
  
  # 🔄 AUTOMATIC BRANCH MAPPING LOGIC HERE:
  CURRENT_BRANCH: >-
    ${{ 
      github.event.inputs.environment == 'dev' && 'DEV-en' ||
      github.event.inputs.environment == 'uat' && 'UAT_' ||
      github.event.inputs.environment == 'staging' && 'staging_env' 
    }}
    
