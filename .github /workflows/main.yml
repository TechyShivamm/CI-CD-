name: Simple CI Workflow

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build-and-test:
    name: Run Initial Checks
    runs-on: ubuntu-latest # Uses a clean, cloud-hosted Ubuntu environment

    steps:
      # Step 1: Check out your repository's code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Print a welcome message
      - name: Say Hello
        run: echo "Hello, world! The workflow is successfully running."

      # Step 3: Run a multi-line script (Simulating tests)
      - name: Run Diagnostic Commands
        run: |
          echo "Current directory: $(pwd)"
          echo "Node version installed on runner:"
          node --version